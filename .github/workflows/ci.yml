name: CI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install core test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pandas sqlalchemy scikit-learn requests python-dotenv langchain-core langchain-openai langgraph

      - name: Syntax check
        run: python -m py_compile src/db_backend.py src/agent_tools.py src/orchestrator.py src/ui.py scripts/eval_agent.py

      - name: Run pytest suite
        env:
          DATA_BACKEND: LOCAL
          SOP_BACKEND: LOCAL
        run: pytest -v tests/test_agent_pipeline.py

